<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lapwing Desktop</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: transparent;
            overflow: hidden;
            font-family: "Microsoft YaHei", sans-serif;
        }

        #canvas-container {
            position: fixed;
            bottom: 0;
            right: 0;
            width: 400px;
            height: 500px;
            pointer-events: auto;
        }

        #live2d-canvas {
            width: 100%;
            height: 100%;
        }

        #chat-bubble {
            position: fixed;
            bottom: 520px;
            right: 20px;
            max-width: 300px;
            padding: 15px 20px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            font-size: 14px;
            line-height: 1.6;
            color: #333;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }

        #chat-bubble.show {
            opacity: 1;
        }

        #chat-bubble::after {
            content: '';
            position: absolute;
            bottom: -10px;
            right: 50px;
            border-width: 10px 10px 0;
            border-style: solid;
            border-color: rgba(255, 255, 255, 0.95) transparent transparent;
        }

        #controls {
            position: fixed;
            top: 10px;
            right: 10px;
            display: flex;
            gap: 10px;
            opacity: 0;
            transition: opacity 0.3s;
        }

        body:hover #controls {
            opacity: 1;
        }

        .btn {
            width: 32px;
            height: 32px;
            border: none;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.9);
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
            transition: all 0.2s;
        }

        .btn:hover {
            background: #fff;
            transform: scale(1.1);
        }

        #input-box {
            position: fixed;
            bottom: 10px;
            right: 420px;
            display: flex;
            gap: 10px;
            opacity: 0;
            transition: opacity 0.3s;
        }

        body:hover #input-box {
            opacity: 1;
        }

        #user-input {
            width: 250px;
            padding: 10px 15px;
            border: none;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.95);
            font-size: 14px;
            outline: none;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        #send-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 20px;
            background: #9b7cb6;
            color: white;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
            transition: all 0.2s;
        }

        #send-btn:hover {
            background: #8a6aa5;
            transform: scale(1.05);
        }

        #status {
            position: fixed;
            top: 10px;
            left: 10px;
            font-size: 12px;
            color: rgba(100, 100, 100, 0.6);
            opacity: 0;
            transition: opacity 0.3s;
        }

        body:hover #status {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div id="status">Lapwing Desktop - Ready</div>

    <div id="controls">
        <button class="btn" id="mic-btn" title="Voice Input">🎤</button>
        <button class="btn" id="hide-btn" title="Hide">👁</button>
        <button class="btn" id="settings-btn" title="Settings">⚙</button>
        <button class="btn" id="quit-btn" title="Quit">✕</button>
    </div>

    <div id="input-box">
        <input type="text" id="user-input" placeholder="Say something to Lapwing...">
        <button id="send-btn">Send</button>
    </div>

    <div id="chat-bubble"></div>

    <div id="canvas-container">
        <canvas id="live2d-canvas"></canvas>
    </div>

    <!-- Live2D Cubism SDK -->
    <script src="https://cubism.live2d.com/sdk-web/cubismcore/live2dcubismcore.min.js"></script>
    <script src="js/live2d.min.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
